<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b3529" />
    <title>SBI is offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f3ea; color: #0b3529; font-family: system-ui, sans-serif; }
      main { width: min(100%, 520px); padding: 32px; border: 1px solid #d8cfbd; border-radius: 24px; background: #fffdf8; box-shadow: 0 18px 50px rgba(11,53,41,.1); }
      h1 { margin: 0 0 12px; font-family: Georgia, serif; font-size: clamp(2rem, 8vw, 3.25rem); line-height: .95; }
      p { margin: 0 0 24px; color: #59645f; line-height: 1.55; }
      button { min-height: 44px; border: 0; border-radius: 999px; padding: 10px 18px; background: #0b3529; color: white; font: inherit; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <p style="color:#8a6a20;font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase">Sandbagger Invitational</p>
      <h1>You’re offline.</h1>
      <p>Reconnect to view current tournament information or submit scores. SBI never reports a score as saved without a confirmed server response.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
